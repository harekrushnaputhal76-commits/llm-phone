name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Step 3: Install Node dependencies
      - name: Install NPM Dependencies
        run: npm install

      # Step 4: Sync Capacitor Android Project
      - name: Sync Capacitor Android
        run: npx cap sync android

      # Step 5: Set up Java JDK 21
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      # Step 6: Accept Android Licenses & Install NDK 29 + CMake
      - name: Setup Android NDK and Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.13113456" "cmake;3.22.1"

      # Step 7: Grant execution permission for gradlew and build Debug APK
      - name: Build Debug APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # Step 8: Upload APK artifact for download
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: offlineai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

